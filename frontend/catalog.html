<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataForge - Catalog</title>
    <meta name="description" content="Browse datasets you have forged and indexed." />
    <meta name="dataforge-api-base" content="http://127.0.0.1:8000" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="catalog">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="DataForge home">
          <span class="brand-mark" aria-hidden="true">DF</span><span>DataForge</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="index.html">Discover</a>
          <a href="forge.html">Forge</a>
          <a href="catalog.html" aria-current="page">Catalog</a>
        </nav>
        <button class="provider" id="providerStatus" data-mode="offline" type="button">AI - Offline</button>
      </header>

      <main>
        <section class="page-head">
          <span class="eyebrow">Your forged datasets</span>
          <h1>The <em>Catalog</em>.</h1>
          <p>Everything you have ingested and packaged, indexed and ready to reuse. Each card shows rows, computed quality, and a difficulty rating.</p>
        </section>

        <div class="cmdbar">
          <button class="button primary" id="refreshCatalogButton" type="button">Refresh catalog</button>
          <a class="button ghost" href="forge.html">Forge a new dataset</a>
        </div>

        <p class="status-line" id="statusLine"></p>
        <section class="card-grid" id="catalogGrid"></section>
      </main>

      <footer class="foot">
        <span>DataForge - Catalog</span>
        <span>Indexed - reproducible - yours</span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <script src="config.js"></script>
    <script src="api-client.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
